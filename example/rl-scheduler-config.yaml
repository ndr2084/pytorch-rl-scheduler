apiVersion: kubescheduler.config.k8s.io/v1beta1
kind: KubeSchedulerConfiguration
percentageOfNodesToScore: 100
profiles:
  - schedulerName: simon-scheduler
    plugins:
      filter:
        enabled:
          - name: Open-Gpu-Share
      preScore:
        # RLScore batches every candidate node into one gRPC call here
        # (see PreScore in rl_score.go); Score() below just reads that
        # cached result. Must be listed here explicitly - PreScore is a
        # separate extension point from Score in the scheduler framework
        # config, not something that follows from enabling a Score plugin.
        disabled:
          - name: RandomScore
        enabled:
          - name: RLScore
      score:
        disabled:
          - name: RandomScore
          - name: DotProductScore
          - name: GpuClusteringScore
          - name: GpuPackingScore
          - name: BestFitScore
          - name: FGDScore
          - name: ImageLocality
          - name: NodeAffinity
          - name: PodTopologySpread
          - name: TaintToleration
          - name: NodeResourcesBalancedAllocation
          - name: InterPodAffinity
          - name: NodeResourcesLeastAllocated
          - name: NodePreferAvoidPods
        enabled:
          - name: RLScore
            weight: 1000
      reserve:
        enabled:
          - name: Open-Gpu-Share
      bind:
        disabled:
          - name: DefaultBinder
        enabled:
          - name: Simon
    pluginConfig:
      - name: RLScore
        args:
          # host:port of the RL policy's gRPC inference server (see pkg/rlscore/proto).
          inferenceAddr: "localhost:50051"
          # Per-RPC deadline in milliseconds; a stuck/unreachable policy server
          # fails that node's score rather than stalling scheduling.
          timeoutMs: 100
      - name: Open-Gpu-Share
        args:
          dimExtMethod: share
          normMethod: max
          # Must match RLScorePlugin.Name() exactly - this is the key
          # allocateGpuIdFunc is registered under in rl_score.go.
          gpuSelMethod: RLScore
